# ===================================================================
# Advanced Job Portal System - Application Configuration
# ===================================================================
spring.application.name=job-portal-system
server.port=8080

# -------------------------------------------------------------------
# MySQL Database Connection
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/jobportal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:JobPortal@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# -------------------------------------------------------------------
# Thymeleaf Template Engine Configuration
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# File Upload Configuration (Resumes, Documents)
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
file.upload-dir=./uploads/resumes

# -------------------------------------------------------------------
# AI Career Assistant & Job Matching Engine Configuration
# -------------------------------------------------------------------
ai.api.provider=${AI_PROVIDER:FALLBACK_RULE_BASED}
ai.api.key=${AI_API_KEY:}
ai.api.model=${AI_MODEL:gemini-1.5-flash}
ai.rate-limit.max-requests-per-minute=10

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.jobportal=DEBUG
logging.level.org.springframework.security=INFO
